# ========== Android APK ==========
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('apk/buildozer.spec') }}

      - name: 安装系统依赖（Buildozer 必备）
        run: |
          sudo apt update
          sudo apt install -y \
            openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libffi-dev libssl-dev \
            python3 python3-pip python3-venv \
            git unzip zip curl ccache \
            gradle

      - name: 安装 Python 工具链
        run: |
          python3 -m pip install --upgrade pip
          pip3 install --upgrade pipx
          pipx ensurepath
          pipx install --force cython==0.29.36 buildozer

      - name: 验证文件结构
        run: |
          echo "=== apk ==="
          ls -la apk/
          test -f apk/main.py && echo "main.py OK"
          test -f apk/buildozer.spec && echo "spec OK"

      - name: 编译 APK（显式路径）
        run: |
          export PATH=$PATH:$HOME/.local/bin
          cd apk
          buildozer -v android debug

      - name: 验证 APK 产物
        run: |
          echo "=== APK bin ==="
          ls -lh apk/bin/ || echo "bin missing"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apk/bin/*.apk
