name: 打包 EXE+APK 并发布 Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ========== Windows EXE ==========
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r windows/requirements.txt
        working-directory: ${{ github.workspace }}

      - name: 验证文件结构
        run: |
          echo "=== windows 文件夹内容 ==="
          dir windows
          echo "=== 检查 main.py 存在 ==="
          if exist windows\main.py (echo OK) else (echo MISSING & exit 1)
          echo "=== 检查 _config_default.json 存在 ==="
          if exist windows\_config_default.json (echo OK) else (echo MISSING & exit 1)
        shell: cmd

      - name: 打包 EXE
        run: |
          set PYTHONUTF8=1
          pyinstaller -F -w ^
            --uac-admin ^
            --name "喵提醒中转" ^
            --add-data "_config_default.json;." ^
            --clean ^
            main.py
        working-directory: windows
        shell: cmd

      - name: 验证 EXE 产物
        run: |
          echo "=== dist 文件夹内容 ==="
          dir windows\dist
        shell: cmd

      - name: 上传 EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: windows/dist/喵提醒中转.exe

  # ========== Android APK ==========
# ========== Android APK ==========
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 清理旧的构建缓存（防止上次失败的垃圾文件干扰）
      - name: Clean old build cache
        run: |
          rm -rf ~/.buildozer
          rm -rf apk/.buildozer
          echo "Cleaned old cache."

      - name: 安装系统依赖（全量版）
        run: |
          sudo apt update
          sudo apt install -y \
            openjdk-17-jdk-headless \
            autoconf automake libtool \
            pkg-config cmake \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libffi-dev libssl-dev \
            python3 python3-pip python3-venv \
            git unzip zip curl wget \
            ccache \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          echo "PATH=$PATH:/usr/lib/jvm/java-17-openjdk-amd64/bin" >> $GITHUB_ENV

      - name: 安装 Python 工具链
        run: |
          python3 -m pip install --upgrade pip
          pip3 install cython==0.29.36 buildozer

      - name: 验证文件结构
        run: |
          echo "=== apk ==="
          ls -la apk/
          test -f apk/main.py || (echo "❌ main.py 缺失" && exit 1)
          test -f apk/buildozer.spec || (echo "❌ spec 缺失" && exit 1)

      - name: 编译 APK（终极防呆版）
        run: |
          cd apk
          # 关键：强制接受所有许可协议，防止卡住
          export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          export ANDROID_NDK_HOME=$HOME/.buildozer/android/platform/android-ndk
          yes | buildozer -v android debug
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          # 防止 Buildozer 在 root 环境下报错
          BUILDOZER_WARN_ON_ROOT: 0

      - name: 验证 APK 产物
        run: |
          echo "=== APK bin ==="
          ls -lh apk/bin/ || echo "bin missing"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apk/bin/*.apk
          # ========== 发布 Release ==========
  release:
    needs: [build-windows, build-apk]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: ./dist-exe

      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: ./dist-apk

      - name: 列出所有产物
        run: |
          echo "=== EXE ==="
          ls -la ./dist-exe/
          echo "=== APK ==="
          ls -la ./dist-apk/

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./dist-exe/喵提醒中转.exe
            ./dist-apk/*.apk
          generate_release_notes: true
          name: 喵提醒中转 ${{ github.ref_name }}
          body: |
            ## 🐱 喵提醒中转 ${{ github.ref_name }}

            ### 📦 下载
            - **Windows**: `喵提醒中转.exe` — 双击运行，自动注册系统托盘
            - **Android**: `miaoremind-debug.apk` — 安装后后台监听

            ### ✨ 功能
            - ✅ 拦截 miaotixing.com → 本地中转
            - ✅ 6 大推送渠道（PushPlus / Server酱 / Bark / Telegram / 钉钉）
            - ✅ 系统托盘 + 配置弹窗（Windows）
            - ✅ 开机自启 + 前台服务（Android）

            ### 🚀 使用
            1. 下载对应平台文件
            2. 首次运行会自动写入 hosts 劫持规则
            3. 配置推送 Token（编辑同目录 _config.json）
            4. 享受无广告的喵提醒 🎉
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
